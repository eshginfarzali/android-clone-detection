plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'dev.clonedetection.guard'
version = '0.1.0'

android {
  namespace "dev.clonedetection.guard.expo"

  defaultConfig {
    versionCode 1
    versionName '0.1.0'

    externalNativeBuild {
      cmake {
        cFlags "-std=c11 -fvisibility=hidden -Os"
      }
    }
  }

  externalNativeBuild {
    cmake {
      path "src/main/cpp/CMakeLists.txt"
      version "3.22.1"
    }
  }
}
