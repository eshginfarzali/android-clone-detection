plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'dev.clonedetection.guard'
version = '0.1.1'

android {
  namespace "dev.clonedetection.guard.expo"

  defaultConfig {
    versionCode 2
    versionName '0.1.1'

    externalNativeBuild {
      cmake {
        cFlags "-std=c11 -fvisibility=hidden -Os"
      }
    }
  }

  externalNativeBuild {
    cmake {
      path "src/main/cpp/CMakeLists.txt"
      version "3.22.1"
    }
  }
}

dependencies {
  testImplementation 'junit:junit:4.13.2'
}
