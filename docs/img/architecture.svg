<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 440" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="880" height="440" rx="16" fill="#0f172a"/>
  <text x="40" y="48" fill="#f8fafc" font-size="22" font-weight="700">One evaluation, two consumers</text>
  <text x="40" y="74" fill="#94a3b8" font-size="14">Detection runs once in onCreate. The block is local; the evidence goes to the server.</text>

  <rect x="40" y="110" width="150" height="56" rx="10" fill="#1e293b" stroke="#475569"/>
  <text x="115" y="143" fill="#f8fafc" font-size="14" text-anchor="middle">Activity.onCreate</text>
  <path d="M190 138 H232" stroke="#64748b" stroke-width="2" marker-end="url(#a)"/>

  <rect x="236" y="96" width="380" height="84" rx="12" fill="#1e3a8a" stroke="#3b82f6"/>
  <text x="426" y="126" fill="#dbeafe" font-size="16" text-anchor="middle" font-weight="700">CloneDetector.evaluate()</text>
  <text x="426" y="152" fill="#bfdbfe" font-size="13" text-anchor="middle">ordered checks, first hit wins, result cached</text>

  <g font-size="13">
    <rect x="40"  y="210" width="190" height="112" rx="10" fill="#1e293b" stroke="#334155"/>
    <text x="56" y="234" fill="#f8fafc" font-weight="700">Launch path</text>
    <text x="56" y="258" fill="#cbd5e1">K1  foreign Instrumentation</text>
    <text x="56" y="280" fill="#cbd5e1">     in the stack trace</text>

    <rect x="244" y="210" width="190" height="112" rx="10" fill="#14532d" stroke="#22c55e"/>
    <text x="260" y="234" fill="#f8fafc" font-weight="700">Kernel</text>
    <text x="260" y="258" fill="#dcfce7">K9  libc vs syscall owner</text>
    <text x="260" y="280" fill="#dcfce7">K7  getuid() vs myUid()</text>

    <rect x="448" y="210" width="190" height="112" rx="10" fill="#1e293b" stroke="#334155"/>
    <text x="464" y="234" fill="#f8fafc" font-weight="700">Framework</text>
    <text x="464" y="258" fill="#cbd5e1">K2  secondary user</text>
    <text x="464" y="280" fill="#cbd5e1">K3/K4  UID ≠ package</text>
    <text x="464" y="302" fill="#cbd5e1">K5/K6  data dir, APK path</text>

    <rect x="652" y="210" width="190" height="112" rx="10" fill="#1e293b" stroke="#334155" stroke-dasharray="5 4"/>
    <text x="668" y="234" fill="#f8fafc" font-weight="700">Integrity (opt-in)</text>
    <text x="668" y="258" fill="#cbd5e1">K8  signing certificate</text>
    <text x="668" y="280" fill="#94a3b8">off until both keys known</text>
  </g>

  <path d="M330 180 V206" stroke="#64748b" stroke-width="2"/>
  <path d="M520 180 V206" stroke="#64748b" stroke-width="2"/>

  <rect x="120" y="354" width="300" height="56" rx="10" fill="#7f1d1d" stroke="#ef4444"/>
  <text x="270" y="378" fill="#fee2e2" font-size="14" text-anchor="middle" font-weight="700">cloneReason ≠ null → block</text>
  <text x="270" y="398" fill="#fecaca" font-size="12" text-anchor="middle">show the code, close the app</text>

  <rect x="460" y="354" width="300" height="56" rx="10" fill="#1e293b" stroke="#a78bfa"/>
  <text x="610" y="378" fill="#ede9fe" font-size="14" text-anchor="middle" font-weight="700">reason + signals → audit</text>
  <text x="610" y="398" fill="#ddd6fe" font-size="12" text-anchor="middle">emulator signals: report, never block</text>
  <defs><marker id="a" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="#64748b"/></marker></defs>
</svg>
